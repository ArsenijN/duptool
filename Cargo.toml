[package]
name = "duptool"
version = "0.1.19"
edition = "2021"
# The build script lives in src/, so Cargo does not find it automatically.
# It provides BUILD_DATE / BUILD_NUMBER / GIT_HASH / FULL_VERSION for -V.
build = "src/build.rs"
authors = ["Arsenii Nochevnyi <arsenijnochevnyj@gmail.com>"]
description = "Advanced duplicate file finder with smart comparison strategies"
license = "MIT"
repository = "https://github.com/ArsenijN/duptool"
readme = "README.md"
keywords = ["duplicate", "files", "comparison", "filesystem", "tool"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
clap = { version = "4.0", features = ["derive", "cargo"] }
walkdir = "2.3"
md5 = "0.7"
indicatif = "0.17"
num_cpus = "1.15"
filetime = "0.2"

[build-dependencies]
chrono = "0.4"